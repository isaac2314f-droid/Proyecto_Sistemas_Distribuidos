services:
  chat:
    environment:
      CENTRAL_URL: http://central:8000
      GROUP_NAME: g3a
      PUBLIC_URL: http://chat:8000

  chat-b:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_PATH: /data/chat.db
      CENTRAL_URL: http://central:8000
      GROUP_NAME: g3b
      PUBLIC_URL: http://chat-b:8000
    volumes:
      - chat-b-data:/data

  central:
    build: .
    command: ["python", "-m", "uvicorn", "central_mock:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./central_mock.py:/app/central_mock.py:ro

volumes:
  chat-b-data: